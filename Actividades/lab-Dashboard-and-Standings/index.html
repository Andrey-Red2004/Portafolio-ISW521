<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Grupos y Standings — Mundial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

  <header id="app-header">
    <h1>Dashboard de Grupos y Standings del Mundial</h1>
    <p id="connection-indicator" role="status" aria-live="polite" aria-atomic="true"></p>
  </header>

  <main id="main-content">

    <section id="auth-section" aria-labelledby="auth-heading">
      <h2 id="auth-heading">Autenticación</h2>

      <form id="login-form" novalidate>
        <fieldset>
          <legend>Iniciar sesión</legend>

          <div class="form-field">
            <label for="username">Usuario</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" id="login-button">Ingresar</button>
        </fieldset>
      </form>

      <p id="auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <section id="filters-section" aria-labelledby="filters-heading">
      <h2 id="filters-heading">Filtros</h2>

      <form id="filters-form">
        <div class="form-field">
          <label for="zone-select">Zona / Grupo</label>
          <select id="zone-select" name="zone" disabled aria-describedby="polling-status">
          </select>
        </div>

        <button type="button" id="refresh-button" disabled>
          Actualizar ahora
        </button>
      </form>

      <p id="polling-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>

    <section id="standings-section" aria-labelledby="standings-heading">
      <h2 id="standings-heading">Tabla de posiciones</h2>

      <article id="standings-article" aria-describedby="standings-caption">
        <table id="standings-table">
          <caption id="standings-caption"></caption>

          <thead id="standings-head">
            <tr>
              <th scope="col" data-sort-key="position" aria-sort="none">
                <button type="button" class="sort-button">Pos.</button>
              </th>
              <th scope="col" data-sort-key="team" aria-sort="none">
                <button type="button" class="sort-button">Equipo</button>
              </th>
              <th scope="col" data-sort-key="played" aria-sort="none">
                <button type="button" class="sort-button">PJ</button>
              </th>
              <th scope="col" data-sort-key="won" aria-sort="none">
                <button type="button" class="sort-button">G</button>
              </th>
              <th scope="col" data-sort-key="drawn" aria-sort="none">
                <button type="button" class="sort-button">E</button>
              </th>
              <th scope="col" data-sort-key="lost" aria-sort="none">
                <button type="button" class="sort-button">P</button>
              </th>
              <th scope="col" data-sort-key="goalsFor" aria-sort="none">
                <button type="button" class="sort-button">GF</button>
              </th>
              <th scope="col" data-sort-key="goalsAgainst" aria-sort="none">
                <button type="button" class="sort-button">GC</button>
              </th>
              <th scope="col" data-sort-key="goalDifference" aria-sort="none">
                <button type="button" class="sort-button">DG</button>
              </th>
              <th scope="col" data-sort-key="points" aria-sort="none">
                <button type="button" class="sort-button">Pts</button>
              </th>
            </tr>
          </thead>

          <tbody id="standings-body">
          </tbody>

          <tfoot>
            <tr>
              <td colspan="10" id="standings-footnote"></td>
            </tr>
          </tfoot>
        </table>
      </article>
    </section>

    <section id="notifications-section" aria-labelledby="notifications-heading">
      <h2 id="notifications-heading">Estado del sistema</h2>

      <article id="error-panel" role="alert" aria-live="assertive" aria-atomic="true" hidden>
        <h3 id="error-title"></h3>
        <p id="error-message"></p>
        <p id="error-detail"></p>
        <button type="button" id="error-retry-button" hidden>Reintentar</button>
        <button type="button" id="error-reauth-button" hidden>Volver a iniciar sesión</button>
      </article>

      <article id="rate-limit-panel" role="status" aria-live="polite" aria-atomic="true" hidden>
        <h3>Límite de peticiones alcanzado</h3>
        <p>
          Reintentando en
          <span id="rate-limit-countdown">0</span> segundos
        </p>
      </article>

      <article id="backoff-panel" role="status" aria-live="polite" aria-atomic="true" hidden>
        <h3>Reconectando</h3>
        <p>
          Intento <span id="backoff-attempt">0</span> —
          próximo intento en <span id="backoff-delay">0</span> segundos
        </p>
      </article>
    </section>

  </main>

  <footer id="app-footer">
    <p>
      Última actualización:
      <time id="last-updated-time"></time>
    </p>
  </footer>

  <template id="row-template">
    <tr>
      <td data-field="position"></td>
      <td data-field="team"></td>
      <td data-field="played"></td>
      <td data-field="won"></td>
      <td data-field="drawn"></td>
      <td data-field="lost"></td>
      <td data-field="goalsFor"></td>
      <td data-field="goalsAgainst"></td>
      <td data-field="goalDifference"></td>
      <td data-field="points"></td>
    </tr>
  </template>

  <template id="zone-option-template">
    <option value=""></option>
  </template>

</body>
</html>
